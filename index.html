<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>ENEM Lab — Plataforma Tática de Estudos</title>
<style>
:root{--bg:#080c14;--s1:#111827;--s2:#1d283d;--ln:#27344d;--tx:#e8edf7;--mu:#8fa0bf;--ac:#ffb703;--ok:#5fd4a0;--er:#ff7a8a;
--h:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--b:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
[data-theme="light"]{--bg:#f4f6f9;--s1:#ffffff;--s2:#e2e8f0;--ln:#cbd5e1;--tx:#1e293b;--mu:#64748b;--ac:#d97706;--ok:#16a34a;--er:#dc2626}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:17px/1.6 var(--b);min-height:100vh;padding-bottom:env(safe-area-inset-bottom);transition:background .2s,color .2s}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.badge{background:var(--er);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px;margin-left:4px;font-weight:700}
main{max-width:960px;margin:auto;padding:8px 18px 24px}
h1,h2,h3{font-family:var(--h);line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.7rem;margin:10px 0 6px}h2{font-size:1.15rem;margin:22px 0 10px}
p.lead{color:var(--mu);margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat span{font:500 .8rem var(--h);color:var(--mu)}.stat b{font:700 1.6rem var(--h)}.stat small{color:var(--mu);font-size:.78rem}
.stat i{display:block;height:5px;border-radius:5px;background:var(--s2);position:relative;overflow:hidden;margin:4px 0}
.stat i::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:7px 14px;font:500 .9rem var(--h)}
.chip[aria-pressed=true]{background:var(--ac);color:#241a00;border-color:var(--ac)}
.btn{background:var(--ac);color:#241a00;border:0;border-radius:10px;padding:12px 20px;font:700 1rem var(--h)}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font:500 .9rem var(--h);margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 .8rem var(--h);color:var(--mu)}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.q{font-size:1.08rem;margin:8px 0 16px;white-space:pre-line}
.alt{display:flex;gap:12px;width:100%;text-align:left;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;margin-bottom:9px;line-height:1.45}
.alt b{font:700 .95rem var(--h);color:var(--ac);min-width:1.1em}
.alt:not(:disabled):hover{border-color:var(--ac)}
.alt.ok{border-color:var(--ok);background:rgba(95,212,160,.12)}.alt.ok b{color:var(--ok)}
.alt.no{border-color:var(--er);background:rgba(255,122,138,.12)}.alt.no b{color:var(--er)}
.alt:disabled{cursor:default;color:var(--tx)}
.fb{border-left:4px solid var(--ac);background:var(--s2);border-radius:0 12px 12px 0;padding:12px 14px;margin:14px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--er)}.fb strong{font-family:var(--h)}
.big{font:700 3rem var(--h);color:var(--ac)}
.bar{height:8px;background:var(--s2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.mu{color:var(--mu)}.empty{text-align:center;padding:30px 10px;color:var(--mu)}
select,input[type="text"]{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;font-family:var(--h)}
textarea{width:100%;min-height:360px;resize:vertical;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:14px;line-height:1.8;font-family:var(--b);font-size:1.02rem}
.ck-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln);gap:12px;flex-wrap:wrap}
.ck-row:last-child{border:0}
.ck-info{flex:1;min-width:200px}.ck-info b{display:block;font-size:.95rem}.ck-info small{color:var(--mu);font-size:.82rem}
.ck-group{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ck-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font:700 .75rem var(--h);color:var(--mu);user-select:none;cursor:pointer}
.ck-btn.on{background:var(--ok);color:#0a291a;border-color:var(--ok)}
.prio{padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:700;margin-left:6px;text-transform:uppercase}
.prio-alta{background:rgba(255,122,138,.2);color:var(--er);border:1px solid var(--er)}
.prio-media{background:rgba(255,183,3,.2);color:var(--ac);border:1px solid var(--ac)}
.prio-padrao{background:rgba(143,180,255,.2);color:#8fb4ff;border:1px solid #8fb4ff}
.flashcard{background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:30px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;margin-bottom:14px}
.flashcard b{font-size:1.2rem;color:var(--ac);margin-bottom:10px}
.vid-link{display:inline-block;margin-top:4px;font-size:0.8rem;color:var(--ac);text-decoration:none}
.vid-link:hover{text-decoration:underline}
.note-box{margin-top:8px;display:flex;gap:6px}
.note-box input{font-size:.85rem;padding:6px 10px}
.feedback-box{background:var(--s2);border-left:4px solid var(--ac);padding:14px;border-radius:0 10px 10px 0;margin-top:12px}
.feedback-box ul{padding-left:18px;margin-top:6px;font-size:0.9rem}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);opacity:.96;backdrop-filter:blur(10px)}
.hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;max-width:960px;margin:auto;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{font:800 1.35rem var(--h);display:flex;align-items:center;gap:9px;letter-spacing:-.02em}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ffb703,#fb8500);display:grid;place-items:center;color:#1a1000;font:800 1rem var(--h)}
.brand span{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;background:var(--s1);border:1px solid var(--ln);border-radius:99px;padding:8px 15px;font:600 .88rem var(--h);color:var(--mu)}
nav button:hover{color:var(--tx)}
nav button[aria-current=page]{background:var(--ac);color:#1a1000;border-color:var(--ac)}
details.card{padding:0}
summary{list-style:none;display:flex;align-items:center;gap:8px;padding:15px 18px;font:700 1rem var(--h);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";color:var(--mu)}details[open] summary::before{content:"\25BE"}
summary span{flex:1}summary em{font-style:normal;color:var(--ac);font-size:.85rem}
details[open] summary{border-bottom:1px solid var(--ln)}
</style>
</head>

<header><div class="hd">
  <div class="brand"><i>E</i>ENEM <span>Lab</span></div>

    <button data-t="sim">Simulado</button>

    <button data-t="cfg">Ajustes & Backup</button>
  </nav></div></header>
<main id="app"></main>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem('enemlab:'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('enemlab:'+k,JSON.stringify(v));return true}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L='ABCDE';
const AREAS={hum:['Ciências Humanas','#ff9f7a'],lin:['Linguagens','#8fb4ff'],nat:['Ciências da Natureza','#5fd4a0'],mat:['Matemática','#ffd166']};

(function(){
  const t=ld('theme','dark');document.body.setAttribute('data-theme',t);
  const now=new Date().toDateString();
  const st=ld('streak',{last:'',count:0});
  if(st.last!==now){
    const yesterday=new Date(Date.now()-86400000).toDateString();
    st.count=st.last===yesterday?st.count+1:1;
    st.last=now;sv('streak',st);
  }
})();

const q=(a,d,t,o,e)=>({a,d,t,o,e});
const Q=[
q('mat','medio',"Uma loja aumentou em 25% o preço de uma camiseta que custava R$ 80,00. Em uma liquidação, aplicou 20% de desconto sobre o preço já reajustado.\n\nO preço final da camiseta, em reais, é:",["80,00","75,00","85,00","100,00","105,00"],"Após o aumento: 80 × 1,25 = 100. Com 20% de desconto: 100 × 0,80 = 80."),
q('mat','facil',"Cinco máquinas idênticas produzem 200 peças em 4 horas de funcionamento. Uma fábrica vai usar 8 dessas máquinas durante 5 horas.\n\nNesse período, o número de peças produzidas será:",["400","320","360","450","500"],"Cada máquina produz 10 peças por hora. Com 8 máquinas por 5 horas: 8 × 5 × 10 = 400 peças."),
q('mat','dificil',"Uma urna contém 3 bolas vermelhas, 5 azuis e 2 verdes. Duas bolas são retiradas ao acaso, sem reposição.\n\nA probabilidade de ambas serem vermelhas é:",["1/15","3/20","9/100","1/10","1/5"],"Primeira vermelha: 3/10. Restam 2 em 9: 2/9. Conjunta: 3/10 × 2/9 = 6/90 = 1/15."),
q('mat','facil',"Um aluno obteve 5,0; 6,5; 7,0 e 7,5 nas quatro primeiras provas. A escola exige média aritmética mínima de 7,0 em cinco provas.\n\nA menor nota necessária na quinta prova é:",["9,0","7,0","8,0","8,5","10,0"],"Soma atual = 26. Para média 7 em 5 provas, soma = 35. Logo, 35 − 26 = 9,0."),
q('mat','medio',"Uma piscina mede 10m de comprimento, 4m de largura e 1,5m de profundidade, cheia por uma bomba de vazão constante de 2.000 L/h (1m³ = 1000L).\n\nO tempo necessário é de:",["30 horas","20 horas","24 horas","36 horas","40 horas"],"Volume = 60 m³ = 60.000 L. Tempo = 60.000 ÷ 2.000 = 30 horas."),
q('mat','medio',"Uma locadora cobra taxa fixa de R$ 120,00 mais R$ 0,80 por km rodado. Um cliente pagou R$ 280,00.\n\nA distância percorrida, em km, foi de:",["200","150","180","220","350"],"C = 120 + 0,8x => 280 = 120 + 0,8x => 0,8x = 160 => x = 200."),
q('mat','dificil',"Dada a função quadrática f(x) = x² - 6x + 8, as coordenadas do vértice da parábola são:",["(3, -1)","(3, 1)","(-3, -1)","(6, 8)","(2, 0)"],"Xv = -b/(2a) = 6/2 = 3. f(3) = 9 - 18 + 8 = -1. Vértice (3, -1)."),
q('mat','facil',"Em uma eleição, a chapa A obteve 1.200 votos, a chapa B 800 votos e houve 500 nulos/brancos. O percentual de votos válidos da chapa A foi:",["60%","48%","52%","80%","75%"],"Válidos = 2000. 1200 / 2000 = 0,60 = 60%."),
q('mat','medio',"Em uma PA de razão 3, o primeiro termo é 4. O vigésimo termo (a₂₀) é:",["61","58","64","55","67"],"a20 = a1 + 19r = 4 + (19 × 3) = 4 + 57 = 61."),
q('mat','dificil',"Um reservatório esférico tem raio de 3m. O volume (V = (4/3)·π·r³, com π = 3) suportado é:",["108","81","216","36","144"],"V = (4/3) × 3 × 27 = 108 m³."),

q('nat','medio',"Após fortes chuvas, esgoto doméstico rico em nitrogênio e fósforo chegou a um lago, causando proliferação de algas e mortandade de peixes.\n\nA causa direta foi:",["a queda do oxigênio dissolvido na decomposição da matéria orgânica","a toxicidade do fósforo nas brânquias","o excesso de luz na água","o falta de gás carbônico","o excesso de oxigênio das algas"],"Eutrofização: bactérias aeróbias consomem oxigênio ao decompor algas mortas."),
q('nat','facil',"Um motorista percorre 150 km em 2h e mais 90 km em 1h. A velocidade escalar média no trajeto todo, em km/h, é:",["80","75","90","100","120"],"Vm = distância total ÷ tempo total = 240 ÷ 3 = 80 km/h."),
q('nat','medio',"A queima de combustíveis com enxofre libera SO₂, gerando chuva ácida. Uma medida direta na origem é:",["reduzir o teor de enxofre nos combustíveis e usar renováveis","aumentar a altura das chaminés","adicionar cal nos rios","substituir monumentos","usar mais combustíveis fósseis"],"Evitar a emissão de SO₂ na fonte combate diretamente o problema."),
q('nat','facil',"A vacina prepara o organismo combatendo agentes sem causar a doença porque:",["estimula a produção de anticorpos e células de memória","fornece anticorpos vitalícios prontos","destrói microrganismos de forma física","altera o DNA","substitui o sistema imune"],"Gera resposta adaptativa duradoura com células de memória."),
q('nat','medio',"Um chuveiro de 5.500 W é usado 20 min por dia durante 30 dias. A energia consumida em kWh é:",["55","18,3","36,7","110","165"],"5,5 kW × 10 horas totais = 55 kWh."),
q('nat','dificil',"Casal heterozigoto (Aa) sem albinismo deseja ter um filho. A probabilidade de nascer com albinismo (recessivo) é:",["25%","0%","50%","75%","100%"],"Cruzamento Aa × Aa resulta em 1/4 (25%) de probabilidade para aa."),
q('nat','facil',"Corpo de 2 kg em repouso recebe força constante de 10 N. A aceleração em m/s² é:",["5","20","2","10","50"],"F = m × a => 10 = 2a => a = 5."),
q('nat','medio',"Na respiração aeróbia, a etapa no citoplasma que gera piruvato e 2 ATPs sem oxigênio é:",["a glicólise","ciclo de Krebs","fosforilação oxidativa","cadeia transportadora","fotofosforilação"],"Glicólise ocorre no citosol de forma anaeróbia."),

q('hum','facil',"No séc. XIX, as fábricas atraíram multidões do campo para cidades como Manchester, gerando bairros precários e jornadas longas.\n\nIsso está associado à:",["urbanização acelerada e formação do proletariado precário","fim do assalariamento","volta ao campo","garantia de leis trabalhistas","poder feudal"],"Concentração urbana sem infraestrutura marcou o início industrial."),
q('hum','medio',"Grandes cidades registram centros mais quentes que periferias arborizadas (ilha de calor). Um fator é:",["a impermeabilização do solo e escassez de áreas verdes","abundância de vegetação","ausência de edifícios","áreas de várzea úmidas","baixa emissão veicular"],"Asfalto retém calor e falta evapotranspiração."),
q('hum','dificil',"Para Thomas Hobbes, no estado de natureza há guerra de todos contra todos. O Estado surge porque:",["um poder soberano forte por pacto garante paz e segurança","a natureza humana é boa","o governo protege a Igreja","a vontade divina dita leis","o povo depõe governantes livremente"],"Contrato social transfere força a um soberano para garantir a ordem."),
q('hum','medio',"A CLT (1943) unificou direitos trabalhistas ao mesmo tempo em que atrelou os sindicatos ao Estado. Seu caráter foi:",["conceder direitos sociais com controle político da classe trabalhadora","eliminar a intervenção estatal","atender rurais","permitir livre sindicalismo","restringir direitos"],"Garantia conquistas e mantinha controle corporativista."),
q('hum','medio',"Entre 1950 e 1980, o Brasil viveu intensa migração do campo para a cidade impulsionada por:",["êxodo rural devido à mecanização e atração industrial urbana","desindustrialização","migração sazonal","colonização agrícola","movimento pendular"],"Fatores de expulsão no campo e atração nas cidades geraram o êxodo."),
q('hum','facil',"A Lei Áurea (1888) acabou com a escravidão sem prever terras ou inclusão para libertos, gerando:",["marginalização socioeconômica e desigualdades persistentes","integração plena","distribuição de terras","fim do racismo","fim de desigualdades"],"Ausência de políticas públicas pós-abolição gerou exclusão."),
q('hum','medio',"O taylorismo/fordismo na produção industrial baseava-se em:",["linhas de montagem rígidas e produção padronizada em massa","artesanato flexível","produção just-in-time","automação robótica"],"Padronização e esteira rolante definiram o modelo."),

q('lin','facil',"— Mano, bora no rolê?\n— Bora! Só trocar de roupa.\n\nO diálogo ilustra:",["variação linguística informal adequada ao contexto","desvio gramatical inaceitável","linguagem jurídica","norma-padrão obrigatória","perda de vocabulário"],"Uso de gírias e informalidade em grupo social específico."),
q('lin','medio',"«A metrópole engole quem chega sem pressa.»\n\nA figura de linguagem predominante é:",["metáfora (atribuição de ação devoradora à cidade)","hipérbole","antítese","ironia","eufemismo"],"Personificação metafórica do ritmo opressor urbano."),
q('lin','facil',"«Doe sangue hoje. Alguém espera por você.»\n\nA função da linguagem predominante é:",["conativa/apelativa (foco no receptor para induzir ação)","referencial","poética","metalinguística","fática"],"Uso de imperativos voltados a convencer o leitor."),
q('lin','medio',"O hábito de checar o celular decorre do desconforto com o vazio e promessa de recompensa das notificações.\n\nSegundo o texto, isso ocorre por:",["busca de alívio e expectativa de recompensa incerta","necessidade informacional","obrigação profissional","ausência de alertas","baixo custo"],"Foco comportamental na dopamina das notificações."),
q('lin','medio',"«Embora estudasse todos os dias, ele não passou», a oração introduzida por «embora» expressa:",["concessão (fato que contraria a expectativa)","causa","finalidade","condição","comparação"],"Concessão marca o contraste com o resultado esperado."),
q('lin','dificil',"A Semana de Arte Moderna de 1922 propôs ruptura com o academicismo e valorização de temas nacionais.\n\nUma característica foi:",["adoção de versos livres, coloquialismo e identidade brasileira","imitation clássica","exaltação ufanista imperial","uso rígido de métrica","rejeição externa"],"Ruptura estética valorizando a língua falada no Brasil."),
q('lin','facil',"Anúncios publicitários usam cores e design com o objetivo principal de:",["persuadir o consumidor e despertar desejos de consumo","transmitir dados científicos","enfeitar a página","restringir leitores"],"Foco persuasivo e mercadológico da publicidade.")
];

const FLASHCARDS=[
["Qual a fórmula do Delta (Δ) na equação do 2º grau?","Δ = b² - 4ac"],
["O que diz a 1ª Lei de Newton (Inércia)?","Um corpo em repouso tende a continuar em repouso, e em movimento em linha reta a continuar em movimento, a menos que uma força atue sobre ele."],
["O que é Eutrofização?","Excesso de nutrientes (nitrogênio e fósforo) em corpos d'água que causa proliferação de algas, consumo de oxigênio e morte de peixes."],
["Quais são os 5 elementos da proposta de intervenção na Redação?","Agente, Ação, Meio/Modo, Efeito e Detalhamento."],
["O que caracteriza o Contratualismo em Filosofia?","A ideia de que o Estado surge através de um pacto/contrato social entre os homens (ex: Hobbes, Locke, Rousseau)."],
["Como calcular o Juro Simples?","J = C · i · t (Capital x taxa x tempo)."]
];

const CRONOGRAMA=[
["Segunda-feira · Matemática & Fundamentos", "Foco em raciocínio lógico e base matemática para garantir pontos valiosos na TRI.", [
  ["Matemática Básica", "Operações, Frações e Decimais (Teoria + 15 exercícios)"],
  ["Razão e Proporção", "Regra de três e Escalas no ENEM"]
]],
["Terça-feira · Ciências Humanas & Cidadania", "Foco em História do Brasil, Sociologia e repertórios para a Redação.", [
  ["História do Brasil", "Brasil Colônia e Império (Foco em economia e sociedade)"],
  ["Sociologia", "Clássicos: Durkheim, Weber e Marx (Conceitos de poder e trabalho)"]
]],
["Quarta-feira · Ciências da Natureza (Parte 1)", "Foco em Biologia e leis fundamentais da Ecologia e Citologia.", [
  ["Biologia - Ecologia", "Cadeias alimentares, fluxo de energia e Eutrofização"],
  ["Biologia - Citologia", "Organelas celulares e metabolismo energético"]
]],
["Quinta-feira · Linguagens & Laboratório de Redação", "Foco em interpretação textual e treino prático de redação nota 1000.", [
  ["Linguagens", "Funções da Linguagem e Variação Linguística"],
  ["Redação Nota 1000", "Escrever 1 redação completa utilizando o Laboratório da plataforma"]
]],

function render(){

  ({sim:vSim,err:vErr,fav:vFav,fla:vFla,red:vRed,cro:vCro,edi:vEdi,cfg:vCfg})[S.tab]();
  window.scrollTo(0,0);

function vSim(){

  const chips=[['all','Todas as áreas'],...Object.entries(AREAS).map(([k,v])=>[k,v[0]])].map(([k,nm])=>`<button class="chip" data-a="${k}" aria-pressed="${S.sel===k}">${nm}</button>`).join('');

  const nn=[5,10,20,30,40].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${S.n===n}">${n} questões</button>`).join('');
  
  $('#app').innerHTML=`
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--s1),var(--s2))">
    <div><b>🔥 Sequência de Estudo: ${streak.count} dia(s) seguidos!</b><p style="font-size:0.85rem;color:var(--mu)">Mantenha a consistência diária para garantir o topo.</p></div>
    <button class="btn sm ghost" id="pom-toggle">${S.pomodoroActive?'⏱️ Pomodoro Ativo ('+Math.floor(S.pomodoroSecs/60)+':'+String(S.pomodoroSecs%60).padStart(2,'0')+')':'⏱️ Iniciar Pomodoro'}</button>
  </div>
  <h1>Simulado ENEM & Preditor TRI</h1><p class="lead">Questões contextualizadas com gabarito comentado e cálculo de nota estimada.</p>
  <div class="grid">${cards}</div>
  <h2>Monte seu simulado</h2>
  <div class="card">
    <label style="display:block;font-size:0.85rem;color:var(--mu);margin-bottom:6px">Área do Conhecimento</label>
    <div class="chips" id="ca">${chips}</div>
    <label style="display:block;font-size:0.85rem;color:var(--mu);margin-bottom:6px">Nível TRI</label>
    <div class="chips" id="cd">${difs}</div>
    <label style="display:block;font-size:0.85rem;color:var(--mu);margin-bottom:6px">Tamanho do Simulado</label>
    <div class="chips" id="cn">${nn}</div>
    <button class="btn" id="go" style="margin-top:10px">Começar simulado</button>
  </div>`;
  
  $('#ca').onclick=e=>{const b=e.target.closest('[data-a]');if(b){S.sel=b.dataset.a;vSim()}};
  $('#cd').onclick=e=>{const b=e.target.closest('[data-d]');if(b){S.dif=b.dataset.d;vSim()}};
  $('#cn').onclick=e=>{const b=e.target.closest('[data-n]');if(b){S.n=+b.dataset.n;vSim()}};
  $('#pom-toggle').onclick=()=>{
    if(S.pomodoroActive){
      clearInterval(S.pomodoroTimer);S.pomodoroActive=false;S.pomodoroSecs=1500;alert('Pomodoro encerrado.');
    }else{
      S.pomodoroActive=true;
      S.pomodoroTimer=setInterval(()=>{
        if(S.pomodoroSecs>0)S.pomodoroSecs--;
        else{clearInterval(S.pomodoroTimer);S.pomodoroActive=false;alert('Pomodoro concluído! Hora de descansar 5 minutos.');}
        const btn=$('#pom-toggle');if(btn)btn.textContent='⏱️ Pomodoro ('+Math.floor(S.pomodoroSecs/60)+':'+String(S.pomodoroSecs%60).padStart(2,'0')+')';
      },1000);
      alert('Pomodoro de 25 minutos iniciado com sucesso!');
    }
    vSim();
  };
  $('#go').onclick=()=>{
    let ids=Q.map((_,i)=>i).filter(i=>{
      const matchArea = S.sel==='all'||Q[i].a===S.sel;
      const matchDif = S.dif==='all'||Q[i].d===S.dif;
      return matchArea && matchDif;
    });
    if(!ids.length){alert('Nenhuma questão encontrada com esses filtros!');return}
    start(shuf(ids).slice(0,S.n),false);
  };
}

function start(ids,review){
  S.z={list:ids,ords:ids.map(()=>shuf([0,1,2,3,4])),i:0,hits:0,res:[],t0:Date.now(),review,ans:null,done:false};
  render();
}

  $('#app').innerHTML=`
  <div class="row" style="justify-content:flex-end;margin-bottom:8px">
    <button class="btn ghost sm" id="fs-btn">⛶ Tela Cheia</button>
  </div>
  <div class="top"><span>${z.review?'Revisão · ':''}Questão ${z.i+1} de ${z.list.length}</span><span id="tm">0:00</span></div>
  <div class="bar" role="progressbar"><i style="width:${z.i/z.list.length*100}%"></i></div>
  <div class="card" style="margin-top:14px" id="sim-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

    <div id="fb"></div>
  </div>`;
  const tick=()=>{const s=Math.floor((Date.now()-z.t0)/1000);$('#tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  tick();S.tm=setInterval(tick,1000);
  $('#fav-btn').onclick=()=>{const f=ld('favs',{});if(f[id])delete f[id];else f[id]=true;sv('favs',f);vQ()};
  $('#fs-btn').onclick=()=>{const c=$('#sim-card');if(!document.fullscreenElement)c.requestFullscreen?.();else document.exitFullscreen?.()};
  $('#alts').onclick=e=>{const b=e.target.closest('.alt');if(b&&!z.ans)pick(+b.dataset.j)};
}

function pick(j){
  const z=S.z,id=z.list[z.i],qq=Q[id],o=z.ords[z.i],ok=o[j]===0;z.ans=true;
  if(ok)z.hits++;z.res.push({id,ok});
  const er=ld('erros',{});if(!ok)er[id]={n:(er[id]?.n||0)+1,mine:qq.o[o[j]],area:qq.a};else if(z.review)delete er[id];sv('erros',er);
  const st=ld('stats',{}),s=st[qq.a]||{c:0,t:0};s.t++;if(ok)s.c++;st[qq.a]=s;sv('stats',st);
  document.querySelectorAll('.alt').forEach((b,i)=>{b.disabled=true;if(o[i]===0)b.classList.add('ok');else if(i===j)b.classList.add('no')});
  const last=z.i+1>=z.list.length;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Correto!':'Resposta certa: '+L[o.indexOf(0)]+'.'}</strong><br>${esc(qq.e)}</div>
  <button class="btn" id="nx">${last?'Ver resultado':'Próxima'}</button>`;
  $('#nx').onclick=()=>{last?(S.z.done=true,render()):(z.i++,z.ans=null,render())};
  $('#bd').hidden=!Object.keys(er).length;$('#bd').textContent=Object.keys(er).length;
}

function vRes(){
  const z=S.z,t=z.res.length,p=t?Math.round(z.hits/t*100):0;
  const notaTRI = Math.min(1000, Math.max(300, Math.round(450 + (p * 5.5))));
  $('#app').innerHTML=`<h1>Resultado do Simulado</h1>
  <div class="card">
    <div class="big">${z.hits}/${t} (${p}%)</div>
    <p><b>Predição TRI estimada:</b> ~${notaTRI} pontos</p>
  </div>
  <div class="row">
    <button class="btn" onclick="S.z=null;render()">Novo Simulado</button>
    ${z.res.some(r=>!r.ok)?`<button class="btn ghost" onclick="start(z.res.filter(r=>!r.ok).map(r=>r.id),true)">Revisar Erros</button>`:''}
  </div>`;
}

function vRed(){
  const saved=ld('redacao','');
  const temasOpts=TEMAS.map((item,i)=>`<option value="${i}">Tema ${i+1}: ${item[0]}</option>`).join('');
  const guiaHTML=GUIA.map(([etapa,pontos])=>`<details class="card"><summary><span>${etapa}</span></summary><ul style="padding-left:20px;margin:10px 0;font-size:0.9rem">${pontos.map(p=>`<li>${p}</li>`).join('')}</ul></details>`).join('');

  $('#app').innerHTML=`<h1>Laboratório de Redação & Corretor Diagnóstico</h1>
  <p class="lead">Escreva sua dissertação (15 a 30 linhas) com base nas diretrizes oficiais do ENEM.</p>
  <div class="card" style="margin-bottom:14px">
    <label style="display:block;font-weight:600;margin-bottom:6px">Tema de Treino:</label>
    <select id="sel-tema">${temasOpts}</select>
  </div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
    <div class="stat"><span>Palavras</span><b id="w-pal">0</b></div>
    <div class="stat"><span>Linhas (Est.)</span><b id="w-lin">0</b><small>Meta: 30 linhas</small></div>
    <div class="stat"><span>Caracteres</span><b id="w-car">0</b></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
    <textarea id="ta-red" placeholder="Digite seu texto dissertativo-argumentativo aqui...">${esc(saved)}</textarea>
  </div>
  <button class="btn" id="btn-corrigir" style="width:100%;margin-bottom:14px">🔎 Analisar & Corrigir Redação</button>
  <div id="relatorio-ia"></div>
  <h2>Guia da Estrutura Nota 1000</h2>${guiaHTML}`;

  const ta=$('#ta-red');
  const up=()=>{
    const v=ta.value,chars=v.length,words=v.trim()?v.trim().split(/\s+/).length:0,lines=Math.round(chars/75);
    $('#w-car').textContent=chars;$('#w-pal').textContent=words;$('#w-lin').textContent=lines;sv('redacao',v);
  };
  ta.oninput=up;up();

  $('#btn-corrigir').onclick=()=>{
    const texto=ta.value.trim();
    if(texto.length < 120){alert('O texto está muito curto! Escreva pelo menos 15 linhas para uma análise diagnóstica confiável.');return;}
    
    const temaSel = TEMAS[+$('#sel-tema').value];
    const dicasPontuacao = [];
    const conectivos = ["portanto","além disso","em primeiro lugar","desse modo","por conseguinte","sendo assim"];
    
    if(/\s[,.]/.test(texto)) dicasPontuacao.push("Evite colocar espaço antes de vírgulas ou pontos.");
    conectivos.forEach(c => {
      const reg = new RegExp(`\\b${c}\\b(?!\\s*,)`, "gi");
      if(reg.test(texto)) dicasPontuacao.push(`Coloque vírgula logo após o conectivo "<b>${c}</b>".`);
    });
    if(/(?:\.|\n)\s*([a-zà-ú])/g.test(texto)) dicasPontuacao.push("Inicie todas as frases após o ponto final com letra maiúscula.");

    const textoMin = texto.toLowerCase();
    const palavrasChave = temaSel[0].toLowerCase().split(' ').filter(w=>w.length>3);
    const chavesEncontradas = palavrasChave.filter(k => textoMin.includes(k));
    const porcTema = Math.min(100, Math.round((chavesEncontradas.length / Math.max(1, palavrasChave.length)) * 100));

    const agentes = ["governo","ministério","escola","mídia","sociedade","ong","família","poder público"];
    const acoes = ["deve","precisa","promover","criar","garantir","investir","assegurar"];
    const meios = ["por meio","através","mediante","com o auxílio"];
    const efeitos = ["para que","com o objetivo","a fim de","garantindo"];

    const temAgente = agentes.some(a => textoMin.includes(a));
    const temAcao = acoes.some(a => textoMin.includes(a));
    const temMeio = meios.some(m => textoMin.includes(m));
    const temEfeito = efeitos.some(e => textoMin.includes(e));
    
    let c5Nota = 40;
    if(temAgente) c5Nota += 40;
    if(temAcao) c5Nota += 40;
    if(temMeio) c5Nota += 40;
    if(temEfeito) c5Nota += 40;

    $('#relatorio-ia').innerHTML=`<div class="card" style="border-color:var(--ac)">
      <h2>📊 Relatório Diagnóstico da Redação</h2>
      <div class="feedback-box">
        <b>📝 1. Gramática e Pontuação (Competência 1):</b>
        ${dicasPontuacao.length ? `<ul>${dicasPontuacao.map(d=>`<li>${d}</li>`).join('')}</ul>` : '<p style="color:var(--ok);margin-top:4px">✓ Excelente uso da pontuação e conectivos!</p>'}
      </div>
      <div class="feedback-box">
        <b>🎯 2. Pertinência ao Tema (Competência 2):</b>
        <p>Aderência estimada: <b>${porcTema}%</b></p>
        <p><small style="color:var(--mu)">${temaSel[1]}</small></p>
      </div>
      <div class="feedback-box">
        <b>🧩 3. Proposta de Intervenção (Competência 5):</b>
        <ul>
          <li>Agente: ${temAgente?'<span style="color:var(--ok)">✓ Encontrado</span>':'<span style="color:var(--er)">✗ Falta citar o agente (ex: Governo)</span>'}</li>
          <li>Ação: ${temAcao?'<span style="color:var(--ok)">✓ Encontrada</span>':'<span style="color:var(--er)">✗ Falta definir a ação</span>'}</li>
          <li>Meio/Modo: ${temMeio?'<span style="color:var(--ok)">✓ Encontrado</span>':'<span style="color:var(--er)">✗ Use "por meio de"</span>'}</li>
          <li>Efeito: ${temEfeito?'<span style="color:var(--ok)">✓ Encontrado</span>':'<span style="color:var(--er)">✗ Use "a fim de"</span>'}</li>
        </ul>
        <p style="margin-top:6px">Nota estimada para C5: <b>~${c5Nota} / 200 pontos</b></p>
      </div>
    </div>`;
  };
}

function vCro(){
  const blocks=CRONOGRAMA.map(([dia,desc,itens],i)=>{
    const rows=itens.map(([topico,detalhes])=>{
      const k=`cro_${i}_${topico}`,done=ld(k,false);
      return `<div class="ck-row"><div class="ck-info"><b>${topico}</b><small>${detalhes}</small></div>
      <div class="ck-group"><span class="ck-btn ${done?'on':''}" onclick="sv('${k}',!ld('${k}',false));vCro()">✓</span></div></div>`;
    }).join('');
    return `<details class="card" open><summary><span>${dia}</span><em>${desc}</em></summary>${rows}</details>`;
  }).join('');
  $('#app').innerHTML=`<h1>Cronograma de Estudos ENEM</h1><p class="lead">Planejamento focado nos conteúdos de maior incidência na prova.</p>${blocks}`;
}

function vEdi(){
  const store=ld('edital_enem',{}),notesStore=ld('enem_notes',{});
  const blocks=ED.map(([title,key,items])=>{
    const rows=items.map(([st,desc,prio,vidUrl],i)=>{
      const idBase=`${key}_${i}`, tOn=store[`${idBase}_t`]?'on':'', eOn=store[`${idBase}_e`]?'on':'', rOn=store[`${idBase}_r`]?'on':'';
      const savedNote=notesStore[idBase]||'';
      const vidHTML=vidUrl?`<br><a href="${vidUrl}" target="_blank" class="vid-link">▶ Assistir Vídeo Aula</a>`:'';
      return `<div class="ck-row"><div class="ck-info"><b>${st} <span class="prio prio-${prio}">${prio}</span></b><small>${desc}${vidHTML}</small>
      <div class="note-box"><input type="text" placeholder="Anotação..." data-note-id="${idBase}" value="${esc(savedNote)}"></div></div>
      <div class="ck-group"><span class="ck-btn ${tOn}" data-k="${idBase}_t">T</span><span class="ck-btn ${eOn}" data-k="${idBase}_e">E</span><span class="ck-btn ${rOn}" data-k="${idBase}_r">R</span></div></div>`;
    }).join('');
    // Removido o atributo 'open' aqui para que os blocos iniciem fechados por padrão
    return `<details class="card"><summary><span>${title}</span></summary>${rows}</details>`;
  }).join('');
  $('#app').innerHTML=`<h1>Edital Verticalizado & Vídeos</h1><p class="lead">Clique na área do conhecimento desejada para expandir os tópicos do dia.</p>${blocks}`;
  
  $('#app').oninput=e=>{
    const input=e.target.closest('[data-note-id]');
    if(input){const k=input.dataset.noteId;const notes=ld('enem_notes',{});notes[k]=input.value;sv('enem_notes',notes)}
  };
  $('#app').onclick=e=>{const btn=e.target.closest('.ck-btn');if(btn){store[btn.dataset.k]=!store[btn.dataset.k];sv('edital_enem',store);vEdi()}};
}

function vCfg(){
  const th=ld('theme','dark');
  $('#app').innerHTML=`<h1>Ajustes & Backup de Dados</h1>
  <div class="card">
    <h2>Aparência da Plataforma</h2>
    <div class="row" style="margin-top:10px">
      <button class="btn ${th==='dark'?'':'ghost'}" onclick="sv('theme','dark');document.body.setAttribute('data-theme','dark');vCfg()">Modo Escuro Tático</button>
      <button class="btn ${th==='light'?'':'ghost'}" onclick="sv('theme','light');document.body.setAttribute('data-theme','light');vCfg()">Modo Claro</button>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>Backup e Portabilidade</h2>
    <p style="font-size:0.9rem;color:var(--mu);margin-bottom:10px">Exporte e guarde seus dados em arquivo JSON para restaurar a qualquer momento.</p>
    <div class="row">
      <button class="btn" onclick="const blob=new Blob([JSON.stringify(localStorage)],{type:'json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='enem-lab-backup.json';a.click()">Exportar Backup JSON</button>
      <label class="btn ghost" style="display:inline-block;cursor:pointer">Importar Backup<input type="file" id="imp" accept=".json" style="display:none"></label>
    </div>
  </div>`;
  
  setTimeout(()=>{
    const imp=$('#imp');
    if(imp) imp.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=evt=>{
        try{
          const data=JSON.parse(evt.target.result);
          Object.keys(data).forEach(k=>localStorage.setItem(k,data[k]));
          alert('Backup importado com sucesso!');
          window.location.reload();
        }catch(err){alert('Ficheiro de backup inválido.')}
      };
      reader.readAsText(file);
    };
  },100);
}

render();
</script>
