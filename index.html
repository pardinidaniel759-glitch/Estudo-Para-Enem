<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>ENEM Lab — Plataforma Tática de Estudos</title>
<style>
:root{--bg:#080c14;--s1:#111827;--s2:#1d283d;--ln:#27344d;--tx:#e8edf7;--mu:#8fa0bf;--ac:#ffb703;--ok:#5fd4a0;--er:#ff7a8a;
--h:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--b:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:17px/1.6 var(--b);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.badge{background:var(--er);color:#1a0b10;border-radius:99px;font-size:.7rem;padding:1px 7px;margin-left:4px;font-weight:700}
main{max-width:960px;margin:auto;padding:8px 18px 24px}
h1,h2,h3{font-family:var(--h);line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.7rem;margin:10px 0 6px}h2{font-size:1.15rem;margin:22px 0 10px}
p.lead{color:var(--mu);margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat span{font:500 .8rem var(--h);color:var(--mu)}.stat b{font:700 1.6rem var(--h)}.stat small{color:var(--mu);font-size:.78rem}
.stat i{display:block;height:5px;border-radius:5px;background:var(--s2);position:relative;overflow:hidden;margin:4px 0}
.stat i::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:7px 14px;font:500 .9rem var(--h)}
.chip[aria-pressed=true]{background:var(--ac);color:#241a00;border-color:var(--ac)}
.btn{background:var(--ac);color:#241a00;border:0;border-radius:10px;padding:12px 20px;font:700 1rem var(--h)}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font:500 .9rem var(--h);margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 .8rem var(--h);color:var(--mu)}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.q{font-size:1.08rem;margin:8px 0 16px;white-space:pre-line}
.alt{display:flex;gap:12px;width:100%;text-align:left;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;margin-bottom:9px;line-height:1.45}
.alt b{font:700 .95rem var(--h);color:var(--ac);min-width:1.1em}
.alt:not(:disabled):hover{border-color:var(--ac)}
.alt.ok{border-color:var(--ok);background:rgba(95,212,160,.12)}.alt.ok b{color:var(--ok)}
.alt.no{border-color:var(--er);background:rgba(255,122,138,.12)}.alt.no b{color:var(--er)}
.alt:disabled{cursor:default;color:var(--tx)}
.fb{border-left:4px solid var(--ac);background:var(--s2);border-radius:0 12px 12px 0;padding:12px 14px;margin:14px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--er)}.fb strong{font-family:var(--h)}
.big{font:700 3rem var(--h);color:var(--ac)}
.bar{height:8px;background:var(--s2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.mu{color:var(--mu)}.empty{text-align:center;padding:30px 10px;color:var(--mu)}
select,input[type="text"]{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;font-family:var(--h)}
textarea{width:100%;min-height:420px;resize:vertical;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:14px;line-height:1.8;font-family:var(--b);font-size:1.02rem}
.ck-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln);gap:12px;flex-wrap:wrap}
.ck-row:last-child{border:0}
.ck-info{flex:1;min-width:200px}.ck-info b{display:block;font-size:.95rem}.ck-info small{color:var(--mu);font-size:.82rem}
.ck-group{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ck-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);font:700 .75rem var(--h);color:var(--mu);user-select:none;cursor:pointer}
.ck-btn.on{background:var(--ok);color:#0a291a;border-color:var(--ok)}
.prio{padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:700;margin-left:6px;text-transform:uppercase}
.prio-alta{background:rgba(255,122,138,.2);color:var(--er);border:1px solid var(--er)}
.prio-media{background:rgba(255,183,3,.2);color:var(--ac);border:1px solid var(--ac)}
.prio-padrao{background:rgba(143,180,255,.2);color:#8fb4ff;border:1px solid #8fb4ff}
.flashcard{background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:30px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;margin-bottom:14px}
.flashcard b{font-size:1.2rem;color:var(--ac);margin-bottom:10px}
.vid-link{display:inline-block;margin-top:4px;font-size:0.8rem;color:var(--ac);text-decoration:none}
.vid-link:hover{text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
header{position:sticky;top:0;z-index:5;background:rgba(8,12,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;max-width:960px;margin:auto;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{font:800 1.35rem var(--h);display:flex;align-items:center;gap:9px;letter-spacing:-.02em}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ffb703,#fb8500);display:grid;place-items:center;color:#1a1000;font:800 1rem var(--h)}
.brand span{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;background:var(--s1);border:1px solid var(--ln);border-radius:99px;padding:8px 15px;font:600 .88rem var(--h);color:var(--mu)}
nav button:hover{color:var(--tx)}
nav button[aria-current=page]{background:var(--ac);color:#1a1000;border-color:var(--ac)}
details.card{padding:0}
summary{list-style:none;display:flex;align-items:center;gap:8px;padding:15px 18px;font:700 1rem var(--h);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";color:var(--mu)}details[open] summary::before{content:"\25BE"}
summary span{flex:1}summary em{font-style:normal;color:var(--ac);font-size:.85rem}
details[open] summary{border-bottom:1px solid var(--ln)}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand"><i>E</i>ENEM <span>Lab</span></div>
  <nav aria-label="Seções">
    <button data-t="sim">Simulado</button>
    <button data-t="err">Caderno de Erros<span id="bd" class="badge" hidden></span></button>
    <button data-t="fav">Favoritas</button>
    <button data-t="fla">Flashcards</button>
    <button data-t="red">Redação</button>
    <button data-t="cro">Cronograma</button>
    <button data-t="edi">Edital</button>
  </nav></div></header>
<main id="app"></main>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem('enemlab:'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('enemlab:'+k,JSON.stringify(v));return true}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L='ABCDE';
const AREAS={hum:['Ciências Humanas','#ff9f7a'],lin:['Linguagens','#8fb4ff'],nat:['Ciências da Natureza','#5fd4a0'],mat:['Matemática','#ffd166']};

const q=(a,d,t,o,e)=>({a,d,t,o,e});
const Q=[
// MATEMÁTICA
q('mat','medio',"Uma loja aumentou em 25% o preço de uma camiseta que custava R$ 80,00. Em uma liquidação, aplicou 20% de desconto sobre o preço já reajustado.\n\nO preço final da camiseta, em reais, é:",["80,00","75,00","85,00","100,00","105,00"],"Após o aumento: 80 × 1,25 = 100. Com 20% de desconto: 100 × 0,80 = 80. Descontos e aumentos sucessivos incidem sobre bases diferentes, por isso não se anulam por soma simples, mas aqui 1,25 × 0,80 = 1, voltando ao valor original."),
q('mat','facil',"Cinco máquinas idênticas produzem 200 peças em 4 horas de funcionamento. Uma fábrica vai usar 8 dessas máquinas durante 5 horas.\n\nNesse período, o número de peças produzidas será:",["400","320","360","450","500"],"Cada máquina produz 200 ÷ 5 ÷ 4 = 10 peças por hora. Com 8 máquinas por 5 horas: 8 × 5 × 10 = 400 peças (grandezas diretamente proporcionais)."),
q('mat','dificil',"Uma urna contém 3 bolas vermelhas, 5 azuis e 2 verdes, todas iguais ao tato. Duas bolas são retiradas ao acaso, uma após a outra, sem reposição.\n\nA probabilidade de ambas serem vermelhas é:",["1/15","3/20","9/100","1/10","1/5"],"Primeira vermelha: 3/10. Sem reposição, restam 2 vermelhas em 9 bolas: 2/9. Probabilidade conjunta: 3/10 × 2/9 = 6/90 = 1/15."),
q('mat','facil',"Um aluno obteve 5,0; 6,5; 7,0 e 7,5 nas quatro primeiras provas do ano. A escola exige média aritmética mínima de 7,0 considerando cinco provas.\n\nA menor nota que ele precisa tirar na quinta prova é:",["9,0","7,0","8,0","8,5","10,0"],"A soma atual é 26. Para média 7 em cinco provas, a soma deve ser 35. Logo, 35 − 26 = 9,0."),
q('mat','medio',"Uma piscina em forma de bloco retangular mede 10 m de comprimento, 4 m de largura e 1,5 m de profundidade. Ela será totalmente cheia por uma bomba com vazão constante de 2.000 litros por hora. (Considere 1 m³ = 1.000 L.)\n\nO tempo necessário para encher a piscina é de:",["30 horas","20 horas","24 horas","36 horas","40 horas"],"Volume = 10 × 4 × 1,5 = 60 m³ = 60.000 L. Tempo = 60.000 ÷ 2.000 = 30 horas."),
q('mat','medio',"Uma locadora cobra, por dia, uma taxa fixa de R$ 120,00 mais R$ 0,80 por quilômetro rodado. Um cliente pagou R$ 280,00 pela diária.\n\nA distância percorrida por ele, em quilômetros, foi de:",["200","150","180","220","350"],"Função afim: C = 120 + 0,8x. Com C = 280: 0,8x = 160, logo x = 200 km."),
q('mat','dificil',"Dada a função quadrática f(x) = x² - 6x + 8, as coordenadas do vértice da parábola correspondente são:",["(3, -1)","(3, 1)","(-3, -1)","(6, 8)","(2, 0)"],"O X do vértice é Xv = -b / (2a) = 6 / 2 = 3. Substituindo na função: f(3) = 9 - 18 + 8 = -1. Logo, o vértice é (3, -1)."),
q('mat','facil',"Em uma eleição para o grêmio estudantil, a chapa A obteve 1.200 votos, a chapa B obteve 800 votos e houve 500 votos em branco/nulos. O percentual de votos válidos obtidos pela chapa A foi de:",["60%","48%","52%","80%","75%"],"Total de votos válidos = 1200 + 800 = 2000. Percentual da chapa A = 1200 / 2000 = 0,60 = 60%."),
q('mat','medio',"Em uma progressão aritmética (PA) de razão 3, o primeiro termo é 4. O vigésimo termo (a₂₀) dessa PA é:",["61","58","64","55","67"],"Fórmula do termo geral: an = a1 + (n - 1) * r. Logo, a20 = 4 + (19 * 3) = 4 + 57 = 61."),
q('mat','dificil',"Um reservatório esférico tem raio de 3 metros. Sabendo que o volume de uma esfera é V = (4/3)·π·r³, o volume total de água que esse reservatório suporta, em metros cúbicos (utilizando π = 3), é:",["108","81","216","36","144"],"V = (4/3) * 3 * (3³) = 4 * 27 = 108 m³."),

// CIÊNCIAS DA NATUREZA
q('nat','medio',"Após fortes chuvas, o esgoto doméstico de um bairro passou a chegar a um lago, rico em nitrogênio e fósforo. Semanas depois, houve proliferação intensa de algas na superfície e mortandade de peixes.\n\nA causa direta da morte dos peixes foi:",["a queda do oxigênio dissolvido, consumido na decomposição da matéria orgânica por microrganismos","a toxicidade do fósforo, que paralisa as brânquias dos peixes","o aumento da luz que atravessa a água, danificando os peixes","o falta de gás carbônico para a respiração dos peixes","o excesso de oxigênio produzido pelas algas"],"É a eutrofização: o excesso de nutrientes favorece algas; ao morrerem, são decompostas por microrganismos aeróbios que consomem o oxigênio da água, causando asfixia dos peixes."),
q('nat','facil',"Um motorista percorre 150 km em 2 horas e, em seguida, mais 90 km em 1 hora, sem paradas.\n\nA velocidade escalar média em todo o trajeto, em km/h, é:",["80","75","90","100","120"],"Velocidade média = distância total ÷ tempo total = (150 + 90) ÷ (2 + 1) = 240 ÷ 3 = 80 km/h. Não é a média simples das velocidades parciais."),
q('nat','medio',"A queima de combustíveis fósseis com enxofre libera dióxido de enxofre (SO₂) na atmosfera. Ao reagir com água e oxigênio, forma ácido sulfúrico, que acidifica a chuva e corrói monumentos e solos.\n\nUma medida que ataca diretamente a origem desse problema é:",["reduzir o teor de enxofre nos combustíveis e ampliar o uso de fontes renováveis","aumentar a altura das chaminés industriais","adicionar cal em todos os rios do país","substituir monumentos de pedra por concreto","ampliar o uso de combustíveis fósseis em áreas rurais"],"A ação mais eficaz é evitar a emissão de SO₂: dessulfurar combustíveis e trocar fontes fósseis por renováveis."),
q('nat','facil',"Durante uma campanha de saúde, um agente explicou que a vacina não causa a doença, mas prepara o organismo para combatê-la.\n\nBiologicamente, isso ocorre porque a vacina:",["estimula a produção de anticorpos e de células de memória imunológica","fornece anticorpos prontos, que agem por toda a vida","destrói diretamente todos os microrganismos do corpo","altera o DNA das células para torná-las resistentes","substitui o sistema imunológico por defesas artificiais"],"A vacina apresenta antígenos que ativam a resposta imune adaptativa, gerando anticorpos e células de memória."),
q('nat','medio',"Um chuveiro elétrico de potência 5.500 W é usado durante 20 minutos por dia, ao longo de 30 dias.\n\nA energia elétrica consumida nesse período, em kWh, é de:",["55","18,3","36,7","110","165"],"Potência = 5,5 kW. Tempo total = 20 min × 30 = 600 min = 10 h. Energia = 5,5 × 10 = 55 kWh."),
q('nat','dificil',"O albinismo oculocutâneo é condição autossômica recessiva. Um casal sem albinismo, ambos heterozigotos (Aa), deseja ter um filho.\n\nA probabilidade de a criança nascer com albinismo é de:",["25%","0%","50%","75%","100%"],"Cruzamento Aa × Aa gera AA, Aa, Aa e aa na proporção 1:2:1. Apenas aa (1 em 4) manifesta albinismo: 25%."),
q('nat','facil',"Um corpo de massa 2 kg repousa sobre uma mesa sem atrito. Uma força constante de 10 N é aplicada horizontalmente sobre ele.\n\nA aceleração adquirida pelo corpo, em m/s², é de:",["5","20","2","10","50"],"Pela 2ª Lei de Newton: F = m * a => 10 = 2 * a => a = 5 m/s²."),
q('nat','medio',"Na respiração celular aeróbia, a etapa que ocorre no citoplasma da célula, gerando piruvato e saldo líquido de 2 ATPs sem consumo de oxigênio, é:",["a glicólise","o ciclo de Krebs","a fosforilação oxidativa","a cadeia transportadora de elétrons","a fotofosforilação"],"A glicólise é a primeira etapa da respiração celular e ocorre no hialoplasma/citoplasma de forma anaeróbia."),

// CIÊNCIAS HUMANAS
q('hum','facil',"No século XIX, a expansão das fábricas na Inglaterra atraiu multidões do campo para cidades como Manchester. Muitos trabalhadores passaram a viver em bairros sem saneamento e a cumprir jornadas superiores a 12 horas.\n\nO processo descrito está associado, na Revolução Industrial, à:",["urbanização acelerada e formação de uma classe operária submetida a condições precárias","valorização do trabalho artesanal e fim do assalariamento","redução da população urbana pela volta ao campo","garantia imediata de direitos trabalhistas por lei","ampliação do poder político dos senhores feudais"],"A industrialização concentrou pessoas nas cidades sem infraestrutura, consolidando o proletariado assalariado em condições precárias."),
q('hum','medio',"Em grandes cidades, é comum que o centro registre temperaturas mais altas que os arredores arborizados. Esse fenômeno é conhecido como ilha de calor.\n\nUm fator que contribui para ele é:",["a impermeabilização do solo e a escassez de áreas verdes, que retêm calor e reduzem a evaporação","a abundância de vegetação, que absorve toda a radiação solar","a ausência de edificações altas, que facilita a circulação do vento","o aumento de áreas de várzea, que umedecem o ar","a baixa emissão de calor por veículos e indústrias"],"Asfalto e concreto absorvem e retêm calor; sem vegetação há menos evapotranspiração."),
q('hum','dificil',"Para Thomas Hobbes, no estado de natureza os indivíduos vivem em permanente insegurança, pois todos têm direito a tudo e ninguém tem garantias contra o outro.\n\nSegundo esse pensador, o Estado se justifica porque:",["um poder soberano forte, criado por pacto, evita a guerra de todos contra todos e garante a paz","a natureza humana é essencialmente boa e dispensa regras","o governo deve existir apenas para proteger a propriedade da Igreja","a vontade divina é a única fonte legítima de leis","o povo deve poder depor o governante a qualquer momento"],"Em Hobbes, o contrato social transfere poder a um soberano capaz de impor a ordem e proteger a vida."),
q('hum','medio',"A Consolidação das Leis do Trabalho (CLT), de 1943, reuniu normas sobre jornada, férias, salário mínimo e carteira de trabalho. O governo de Getúlio Vargas, ao mesmo tempo, regulamentou a organização sindical, subordinando-a ao Estado.\n\nO caráter dessa legislação foi o de:",["conceder direitos aos trabalhadores urbanos enquanto o Estado controlava e integrava a classe trabalhadora","eliminar a intervenção do Estado nas relações de trabalho","atender apenas aos trabalhadores rurais","permitir a livre criação de sindicatos autônomos","restringir direitos trabalhistas para estimular a indústria"],"A CLT ampliou direitos sociais, mas com sindicatos atrelados ao Ministério do Trabalho, garantindo controle político."),
q('hum','medio',"Entre as décadas de 1950 e 1980, milhões de brasileiros deixaram o campo em direção às cidades. Nesse período, houve mecanização da agricultura, concentração de terras e expansão do emprego industrial nos centros urbanos.\n\nO fenômeno descrito é o:",["êxodo rural, impulsionado por fatores de expulsão do campo e de atração das cidades","êxodo urbano, causado pela desindustrialização","movimento pendular diário entre cidades-dormitório","migração sazonal para a colheita","processo de colonização de fronteiras agrícolas"],"O êxodo rural combinou fatores de expulsão (mecanização) e de atração (emprego industrial)."),
q('hum','facil',"A Lei Áurea (1888) extinguiu a escravidão no Brasil, mas não previu reforma agrária, acesso à educação nem indenização ou inserção produtiva para as pessoas libertas.\n\nUma consequência histórica dessa omissão foi:",["a marginalização socioeconômica da população negra no pós-abolição, com reflexos de desigualdade até hoje","a integração plena e imediata dos libertos ao mercado de trabalho","a distribuição de terras às famílias libertas","a extinção do racismo na sociedade brasileira","o fim das desigualdades regionais"],"A abolição sem políticas de inclusão social deixou os libertos sem terra e moradia, gerando desigualdades persistentes."),
q('hum','medio',"O modelo de produção taylorista/fordista, dominante na primeira metade do século XX, baseava-se em:",["linhas de montagem rigidamente cadenciadas e alta padronização de produtos em massa","trabalho artesanal flexível com autonomia total do operário","produção sob demanda estrita (sistema just-in-time)"," descentralização industrial e automação robótica avançada"],"O Fordismo introduziu a linha de montagem e a produção em massa padronizada."),

// LINGUAGENS
q('lin','facil',"— Mano, bora no rolê hoje?\n— Bora! Só vou trocar de roupa e já te encontro.\n\nO diálogo, entre dois jovens, ilustra:",["a variação linguística de registro informal, adequada ao contexto e ao grupo social dos falantes","um desvio gramatical que impede a comunicação","o uso de linguagem formal típica de textos jurídicos","a imposição da norma-padrão como única forma correta","a perda de vocabulário na língua portuguesa"],"Expressões informais marcam o registro adequado ao grupo social e à situação de comunicação."),
q('lin','medio',"«A metrópole engole quem chega sem pressa.»\n\nNesse enunciado, a figura de linguagem predominante é:",["metáfora, pois a cidade é descrita como um ser que devora, sugerindo seu caráter opressor","hipérbole, pois exagera a quantidade de pessoas","antítese, pois contrapõe duas palavras de sentido oposto","ironia, pois diz o contrário do que pensa","eufemismo, pois suaviza uma ideia desagradável"],"Atribuir à cidade o ato de «engolir» é uma metáfora que personifica o caráter opressor da metrópole."),

const S={tab:'sim',sel:'all',dif:'all',n:10,z:null,tm:null,fcIdx:0,fcRev:false};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
function render(){
  clearInterval(S.tm);
  document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.t===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const n=Object.keys(ld('erros',{})).length,bd=$('#bd');bd.hidden=!n;bd.textContent=n;
  ({sim:vSim,err:vErr,fav:vFav,fla:vFla,red:vRed,cro:vCro,edi:vEdi})[S.tab]();
  window.scrollTo(0,0);
}

function vSim(){
  if(S.z&&S.z.done)return vRes();
  if(S.z)return vQ();
  const st=ld('stats',{});
  const cards=Object.entries(AREAS).map(([k,[nm,c]])=>{const s=st[k]||{c:0,t:0},p=s.t?Math.round(s.c/s.t*100):0;
    return `<div class="stat"><span>${nm}</span><b>${s.t?p+'%':'–'}</b><i style="--p:${p}%;--c:${c}"></i><small>${s.c} de ${s.t} corretas</small></div>`}).join('');
  const chips=[['all','Todas as áreas'],...Object.entries(AREAS).map(([k,v])=>[k,v[0]])].map(([k,nm])=>`<button class="chip" data-a="${k}" aria-pressed="${S.sel===k}">${nm}</button>`).join('');
  const difs=[['all','Todas as dificuldades'],['facil','Fáceis'],['medio','Médias'],['dificil','Difíceis']].map(([k,nm])=>`<button class="chip" data-d="${k}" aria-pressed="${S.dif===k}">${nm}</button>`).join('');
  const nn=[5,10,20,30,40].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${S.n===n}">${n} questões</button>`).join('');
  
  $('#app').innerHTML=`<h1>Simulado ENEM (Prova Real)</h1><p class="lead">Questões contextualizadas nos moldes da prova oficial com gabarito comentado e nível TRI.</p>
  <div class="grid">${cards}</div>
  <h2>Monte seu simulado</h2>
  <div class="card">
    <label style="display:block;font-size:0.85rem;color:var(--mu);margin-bottom:6px">Área do Conhecimento</label>
    <div class="chips" id="ca">${chips}</div>
    <label style="display:block;font-size:0.85rem;color:var(--mu);margin-bottom:6px">Nível TRI</label>
    <div class="chips" id="cd">${difs}</div>
    <label style="display:block;font-size:0.85rem;color:var(--mu);margin-bottom:6px">Tamanho do Simulado</label>
    <div class="chips" id="cn">${nn}</div>
    <button class="btn" id="go" style="margin-top:10px">Começar simulado</button>
  </div>`;
  
  $('#ca').onclick=e=>{const b=e.target.closest('[data-a]');if(b){S.sel=b.dataset.a;vSim()}};
  $('#cd').onclick=e=>{const b=e.target.closest('[data-d]');if(b){S.dif=b.dataset.d;vSim()}};
  $('#cn').onclick=e=>{const b=e.target.closest('[data-n]');if(b){S.n=+b.dataset.n;vSim()}};
  $('#go').onclick=()=>{
    let ids=Q.map((_,i)=>i).filter(i=>{
      const matchArea = S.sel==='all'||Q[i].a===S.sel;
      const matchDif = S.dif==='all'||Q[i].d===S.dif;
      return matchArea && matchDif;
    });
    if(!ids.length){alert('Nenhuma questão encontrada com esses filtros!');return}
    start(shuf(ids).slice(0,S.n),false);
  };
}
function start(ids,review){
  S.z={list:ids,ords:ids.map(()=>shuf([0,1,2,3,4])),i:0,hits:0,res:[],t0:Date.now(),review,ans:null,done:false};
  render();
}
function vQ(){
  const z=S.z,id=z.list[z.i],qq=Q[id],o=z.ords[z.i],[nm,c]=AREAS[qq.a];
  const favs=ld('favs',{});const isFav=favs[id];
  $('#app').innerHTML=`<div class="top"><span>${z.review?'Revisão · ':''}Questão ${z.i+1} de ${z.list.length}</span><span id="tm">0:00</span></div>
  <div class="bar" role="progressbar"><i style="width:${z.i/z.list.length*100}%"></i></div>
  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="tag" style="--c:${c}">${nm} (${qq.d.toUpperCase()})</span>
      <button class="btn ghost sm" id="fav-btn">${isFav?'★ Favorita':'☆ Favoritar'}</button>
    </div>
    <p class="q">${esc(qq.t)}</p>
    <div id="alts">${o.map((k,j)=>`<button class="alt" data-j="${j}"><b>${L[j]}</b><span>${esc(qq.o[k])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>
  <button class="btn ghost sm" id="quit">Encerrar simulado</button>`;
  
  $('#fav-btn').onclick=()=>{
    const f=ld('favs',{});
    if(f[id])delete f[id];else f[id]=true;
    sv('favs',f);vQ();
  };

  const tick=()=>{const s=Math.floor((Date.now()-z.t0)/1000);$('#tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  tick();S.tm=setInterval(tick,1000);
  $('#alts').onclick=e=>{const b=e.target.closest('.alt');if(b&&!z.ans)pick(+b.dataset.j)};
  $('#quit').onclick=()=>{if(confirm('Encerrar o simulado agora? As respostas já dadas ficam salvas.')){z.list=z.list.slice(0,z.res.length);z.i=z.res.length;finish()}};
}
function pick(j){
  const z=S.z,id=z.list[z.i],qq=Q[id],o=z.ords[z.i],ok=o[j]===0;z.ans=true;
  if(ok)z.hits++;z.res.push({id,ok});
  const st=ld('stats',{});st[qq.a]=st[qq.a]||{c:0,t:0};st[qq.a].t++;if(ok)st[qq.a].c++;sv('stats',st);
  const er=ld('erros',{});
  if(!ok)er[id]={n:(er[id]?.n||0)+1,d:new Date().toISOString().slice(0,10),mine:qq.o[o[j]]};
  else if(z.review)delete er[id];
  sv('erros',er);
  document.querySelectorAll('.alt').forEach((b,i)=>{b.disabled=true;if(o[i]===0)b.classList.add('ok');else if(i===j)b.classList.add('no')});
  const last=z.i+1>=z.list.length;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Correto!':'Resposta certa: alternativa '+L[o.indexOf(0)]+'.'}</strong><br>${esc(qq.e)}${!ok?'<br><span class="mu">Esta questão foi para o seu Caderno de Erros.</span>':''}</div>
  <button class="btn" id="nx">${last?'Ver resultado':'Próxima questão'}</button>`;
  $('#nx').onclick=()=>{last?finish():(z.i++,z.ans=null,render())};
  $('#nx').focus();
  const bd=$('#bd'),n=Object.keys(er).length;bd.hidden=!n;bd.textContent=n;
}
function finish(){S.z.done=true;S.z.secs=Math.floor((Date.now()-S.z.t0)/1000);render()}
function vRes(){
  const z=S.z,t=z.res.length,p=t?Math.round(z.hits/t*100):0;
  const by={};z.res.forEach(r=>{const a=Q[r.id].a;by[a]=by[a]||{c:0,t:0};by[a].t++;if(r.ok)by[a].c++});
  const rows=Object.entries(by).map(([k,v])=>`<div class="ck-row"><span style="flex:1">${AREAS[k][0]}</span><b>${v.c}/${v.t}</b></div>`).join('');
  $('#app').innerHTML=`<h1>Resultado</h1><div class="card"><div class="big">${z.hits}/${t}</div>
  <p>${p}% de acertos em ${Math.floor(z.secs/60)} min ${z.secs%60} s. ${p>=70?'Ótimo ritmo, continue assim.':p>=40?'Bom caminho: revise o Caderno de Erros.':'Use as explicações para fechar as lacunas e tente de novo.'}</p></div>
  <div class="card">${rows||'<p class="mu">Nenhuma questão respondida.</p>'}</div>
  <div class="row"><button class="btn" id="nv">Novo simulado</button><button class="btn ghost" id="ce">Abrir Caderno de Erros</button></div>`;
  $('#nv').onclick=()=>{S.z=null;render()};$('#ce').onclick=()=>{S.z=null;S.tab='err';render()};
}

  const er=ld('erros',{}),ids=Object.keys(er).map(Number);
  if(!ids.length){$('#app').innerHTML=`<h1>Caderno de Erros</h1><div class="card empty">Nenhum erro por aqui ainda. As questões que você errar no simulado aparecem automaticamente neste caderno.<br><br><button class="btn" id="g">Fazer um simulado</button></div>`;
    $('#g').onclick=()=>{S.tab='sim';render()};return}

  $('#rv').onclick=()=>{S.tab='sim';start(shuf(ids),true)};
  $('#cl').onclick=()=>{if(confirm('Apagar todo o Caderno de Erros?')){sv('erros',{});render()}};
  $('#app').onclick=e=>{const b=e.target.closest('[data-d]');if(b){const m=ld('erros',{});delete m[b.dataset.d];sv('erros',m);render()}};
}

function vFav(){
  const favs=ld('favs',{}),ids=Object.keys(favs).map(Number);
  if(!ids.length){$('#app').innerHTML=`<h1>Questões Favoritas</h1><div class="card empty">Nenhuma questão favoritada. Clique em "Favoritar" durante os simulados para guardá-las aqui.</div>`;return}
  const items=ids.map(id=>{const x=Q[id],[nm,c]=AREAS[x.a];
    return `<div class="card"><span class="tag" style="--c:${c}">${nm}</span>
    <p class="q" style="margin:8px 0">${esc(x.t)}</p>
    <div class="fb">${esc(x.e)}</div><button class="btn ghost sm" data-rem="${id}">Remover dos favoritos</button></div>`}).join('');
  $('#app').innerHTML=`<h1>Questões Favoritas</h1><p class="lead">${ids.length} questão(ões) salva(s) para consulta rápida.</p>${items}`;
  $('#app').onclick=e=>{const b=e.target.closest('[data-rem]');if(b){const f=ld('favs',{});delete f[b.dataset.rem];sv('favs',f);vFav()}};
}

function vFla(){
  const fc=FLASHCARDS[S.fcIdx];
  $('#app').innerHTML=`<h1>Flashcards de Revisão</h1><p class="lead">Memorize conceitos-chave, fórmulas e estruturas para o ENEM.</p>
  <div class="flashcard" id="fc-box">
    <small style="color:var(--mu);margin-bottom:10px">Cartão ${S.fcIdx+1} de ${FLASHCARDS.length} (Clique para virar)</small>
    <b>${S.fcRev ? 'Resposta:' : 'Pergunta:'}</b>
    <p style="font-size:1.15rem">${esc(fc[S.fcRev?1:0])}</p>
  </div>
  <div class="row" style="justify-content:center">
    <button class="btn ghost" id="fc-prev">Anterior</button>
    <button class="btn" id="fc-next">Próximo Cartão</button>
  </div>`;
  $('#fc-box').onclick=()=>{S.fcRev=!S.fcRev;vFla()};
  $('#fc-prev').onclick=()=>{S.fcIdx=(S.fcIdx-1+FLASHCARDS.length)%FLASHCARDS.length;S.fcRev=false;vFla()};
  $('#fc-next').onclick=()=>{S.fcIdx=(S.fcIdx+1)%FLASHCARDS.length;S.fcRev=false;vFla()};
}

function vCro(){
  const cards=CRONOGRAMA.map(([title,desc,tasks],idx)=>{
    const taskList=tasks.map(([tName,tDesc])=>`<li style="margin-bottom:6px"><b>${tName}:</b> <span style="color:var(--mu)">${tDesc}</span></li>`).join('');
    return `<details class="card" ${idx===0?'open':''}><summary><span>${title}</span><em>Ciclo Diário</em></summary>
    <div style="padding:0 18px 15px 18px">
      <p style="color:var(--ac);font-size:0.9rem;margin-bottom:10px">${desc}</p>
      <ul style="padding-left:18px">${taskList}</ul>
    </div></details>`;
  }).join('');
  $('#app').innerHTML=`<h1>Cronograma Semanal de Estudos</h1><p class="lead">Sua rotina tática de Segunda a Domingo para obter o máximo rendimento no menor tempo possível.</p>${cards}`;
}

function vEdi(){
  const store=ld('edital_v3',{}),filterText=(S.ediFilter||'').toLowerCase();
  let totalItems=0,doneItems=0;const areaStats={};
  ED.forEach(([t,key,items])=>{
    let aTotal=items.length*3,aDone=0;
    items.forEach((_,i)=>{['t','e','r'].forEach(type=>{if(store[`${key}_${i}_${type}`])aDone++})});
    areaStats[key]={name:t,total:aTotal,done:aDone};totalItems+=aTotal;doneItems+=aDone;
  });
  const globalP=totalItems?Math.round((doneItems/totalItems)*100):0;
  const areaCardsHTML=Object.entries(areaStats).map(([k,st])=>{
    const p=st.total?Math.round((st.done/st.total)*100):0;const [,col]=AREAS[k]||['#ffb703'];
    return `<div class="stat"><span>${st.name.split(' ')[0]}</span><b>${p}%</b><i style="--p:${p}%;--c:${col}"></i><small>${st.done}/${st.total} etapas</small></div>`;
  }).join('');

  const blocksHTML=ED.map(([title,areaKey,items])=>{
    const filteredItems=items.filter(([st,desc])=>!filterText||st.toLowerCase().includes(filterText)||desc.toLowerCase().includes(filterText));
    if(filterText&&!filteredItems.length)return '';
    const rows=filteredItems.map(([st,desc,prio,vidUrl],i)=>{
      const idBase=`${areaKey}_${i}`;
      const tOn=store[`${idBase}_t`]?'on':'';const eOn=store[`${idBase}_e`]?'on':'';const rOn=store[`${idBase}_r`]?'on':'';
      const prioClass=prio==='alta'?'prio-alta':(prio==='media'?'prio-media':'prio-padrao');
      const prioLabel=prio==='alta'?'Alta Incidência':(prio==='media'?'Média':'Padrão');
      const vidLinkHTML = vidUrl ? `<br><a href="${vidUrl}" target="_blank" class="vid-link">▶ Assistir Aula Resumida Recomendada</a>` : '';
      return `<div class="ck-row"><div class="ck-info"><b>${st} <span class="prio ${prioClass}">${prioLabel}</span></b><small>${desc}${vidLinkHTML}</small></div>
      <div class="ck-group"><span class="ck-btn ${tOn}" data-k="${idBase}_t" title="Teoria">T</span><span class="ck-btn ${eOn}" data-k="${idBase}_e" title="Exercícios">E</span><span class="ck-btn ${rOn}" data-k="${idBase}_r" title="Revisão">R</span></div></div>`;
    }).join('');
    return `<details class="card" open><summary><span>${title}</span><em>${filteredItems.length} tópicos</em></summary>${rows}</details>`;
  }).join('');

  $('#app').innerHTML=`<h1>Edital Verticalizado Tático</h1><p class="lead">Acompanhe seu progresso real dividindo cada tópico em Teoria (T), Exercícios (E) e Revisão (R).</p>
  <div class="card"><div class="top"><span>Progresso Geral do Edital</span><b>${globalP}% Concluído</b></div>
  <div class="bar" style="height:12px;margin-bottom:14px"><i style="width:${globalP}%"></i></div>
  <div class="grid">${areaCardsHTML}</div></div>
  <div class="row" style="margin-bottom:14px"><input type="text" id="edi-search" placeholder="Pesquisar tópico (ex: Delta, Ecologia, Vargas)..." value="${esc(S.ediFilter||'')}"></div>
  ${blocksHTML||'<div class="card empty">Nenhum tópico encontrado para essa busca.</div>'}`;

  $('#edi-search').oninput=e=>{S.ediFilter=e.target.value;vEdi()};
  $('#app').onclick=e=>{const btn=e.target.closest('.ck-btn');if(btn){const k=btn.dataset.k;store[k]=!store[k];sv('edital_v3',store);vEdi()}};
}

function vRed(){
  const saved=ld('redacao','');
  const temasOpts=TEMAS.map(([t],i)=>`<option value="${i}">Tema ${i+1}: ${t}</option>`).join('');
  const guiaHTML=GUIA.map(([ti,pts])=>`<details class="card" style="margin-bottom:8px"><summary><span>${ti}</span></summary><ul style="padding:0 20px 10px 20px;color:var(--mu);font-size:.9rem">${pts.map(p=>`<li>${p}</li>`).join('')}</ul></details>`).join('');

  $('#app').innerHTML=`<h1>Laboratório de Redação</h1><p class="lead">Estruture sua dissertação-argumentativa e acompanhe o tamanho do texto em tempo real.</p>
  <div class="card" style="margin-bottom:14px"><label style="display:block;font-weight:600;margin-bottom:6px">Escolha um Tema de Treino:</label>
  <select id="sel-tema">${temasOpts}</select><p id="repertorio-sug" style="margin-top:8px;font-size:0.9rem;color:var(--ac)"></p></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
    <div class="stat"><span>Palavras</span><b id="w-pal">0</b></div>
    <div class="stat"><span>Linhas (Est.)</span><b id="w-lin">0</b><small>Meta: ~30 linhas</small></div>
    <div class="stat"><span>Caracteres</span><b id="w-car">0</b></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px"><textarea id="ta-red" placeholder="Comece a escrever seu texto dissertativo aqui...">${esc(saved)}</textarea></div>
  <h2>Guia Tático: Estrutura da Redação ENEM</h2>${guiaHTML}`;

  const ta=$('#ta-red'),sel=$('#sel-tema'),rep=$('#repertorio-sug');
  const updateRep=()=>{const idx=+sel.value;rep.textContent=TEMAS[idx][1];if(!ta.value.trim()){ta.value=`Tema: ${TEMAS[idx][0]}\n\n`;up()}};
  const up=()=>{
    const v=ta.value,chars=v.length,words=v.trim()?v.trim().split(/\s+/).length:0,lines=Math.round(chars/75);
    $('#w-car').textContent=chars;$('#w-pal').textContent=words;$('#w-lin').textContent=lines;sv('redacao',v);
  };
  sel.onchange=updateRep;ta.oninput=up;updateRep();up();
}

render();
</script>
</body>
</html>
